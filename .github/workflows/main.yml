
name: Build Lucky Audio APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get files
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Unzip project
        run: unzip LuckyAudioProject.zip

      - name: Build APK
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile app
        run: gradle -p LuckyAudioProject assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: LuckyAudio-APK
          path: LuckyAudioProject/app/build/outputs/apk/debug/app-debug.apk
